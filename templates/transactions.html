{% extends "base.html" %}
{% block title %}Movimientos{% endblock %}
{% block content %}
<h1>Movimientos</h1>
<section class="card">
  <h3>Registrar movimiento</h3>
  <form id="form-tx" class="inline-form wrap">
    <select name="type" id="tx-type"><option value="expense">Gasto</option><option value="income">Ingreso</option></select>
    <input name="amount" type="number" min="0.01" step="0.01" placeholder="Monto" required>
    <select name="category" id="tx-category"></select>
    <input name="description" placeholder="Descripción" maxlength="120">
    <input name="date" type="date">
    <button class="btn" type="submit">Guardar</button>
  </form>
</section>

<section class="card">
  <div class="card-head">
    <h3>Historial</h3>
    <div class="inline-form">
      <select id="f-type"><option value="">Todos</option><option value="income">Ingresos</option><option value="expense">Gastos</option></select>
      <input type="month" id="f-period">
      <button class="btn ghost small" id="f-clear" type="button">Limpiar</button>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Descripción</th><th class="num">Monto</th><th></th></tr></thead>
      <tbody id="tx-body"></tbody>
    </table>
  </div>
  <p id="tx-totals" class="muted"></p>
</section>
<script>
  window.EXPENSE_CATEGORIES = {{ expense_categories|tojson }};
  window.INCOME_CATEGORIES = {{ income_categories|tojson }};
</script>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/transactions.js') }}"></script>{% endblock %}
